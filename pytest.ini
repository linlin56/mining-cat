[pytest]
testpaths = src/tests
pythonpath = src src/tests
python_files = *.test.py
python_classes = Test*
python_functions = test_*
# GUI tests open Tk windows: skipped by default, run them with `make test-gui`.
addopts = --import-mode=importlib -m "not gui"
markers =
    gui: opens Tk windows (run with `make test-gui`)
