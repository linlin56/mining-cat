<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MiningCat · Clipboard</title>
  <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ url_for('static', filename='game.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='clipboard.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='mining.css') }}">
  <script src="{{ url_for('static', filename='mining.js') }}" defer></script>
  <script src="{{ url_for('static', filename='clipboard.js') }}" defer></script>
</head>
<body data-study='{{ study|tojson }}'>
  <header class="game-bar">
    <a class="brand" href="/">🐱 Clipboard</a>
    <span class="game-count dim" id="count"></span>
    <span class="spacer"></span>
    <select class="btn" id="language" title="Characters" hidden></select>
    <button type="button" class="btn" id="clear" title="Empty the clipboard">Clear</button>
    <button type="button" class="btn btn-primary" id="toggle" title="Ctrl/⌘ + Enter">Read</button>
  </header>
  <main class="clip">
    <textarea class="clip-editor" id="editor" spellcheck="false"
      placeholder="Type or paste a text here, then click Read to look its words up."></textarea>
    <article class="clip-text" id="text" hidden></article>
  </main>
</body>
</html>
