# The Taiwan readings that "Force Taiwanese pronunciation" imposes on Mandarin words whatever the dictionaries say.
# MiningCat's own list, written by hand... Please report any mistake!
# Format:
# One word per line: "word" = "reading"
# in numbered pinyin (shi2 hou4, neutral tone 5) because it's easier to type
# 一 stays yi1 and 不 bu4 just like in most dictionaries.
# Sections only group the words: a word should only appear once in the whole file.
# Rare meanings are left out.

["垃圾 is le4 se4"]
# 垃圾 is le4 se4 in Taiwan (la1 ji1 in China).
"垃圾" = "le4 se4"
"垃圾桶" = "le4 se4 tong3"
"垃圾車" = "le4 se4 che1"
"垃圾袋" = "le4 se4 dai4"

["neutral tone in Taiwan"]
# Taiwan keeps the neutral tone that some dictionaries give in full.
"告訴" = "gao4 su5"  # to tell; gao4 su4 is the legal 'to sue'
"意思" = "yi4 si5"
"熱鬧" = "re4 nao5"

["full tone in Taiwan"]
