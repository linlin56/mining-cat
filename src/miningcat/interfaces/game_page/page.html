<!DOCTYPE html>
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiningCat - Game OCR</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600&family=Noto+Serif+SC:wght@400;600&family=Noto+Serif+JP:wght@400;600&family=Noto+Serif+KR:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/vendor/bootstrap/bootstrap.min.css">
<link rel="stylesheet" href="/static/vendor/bootstrap-icons/bootstrap-icons.min.css">
<link rel="stylesheet" href="/static/theme.css">
<link rel="stylesheet" href="/page.css">
</head>
<body data-bs-theme="dark">

<header class="navbar sticky-top bg-body border-bottom">
  <div class="container gap-2">
    <span class="navbar-brand d-flex align-items-center gap-2 fw-bold me-0">
      <img src="/static/favicon.svg" alt="" width="26" height="26"> MiningCat
    </span>
    <span class="badge rounded-pill text-bg-warning" id="status">connecting…</span>
    <span class="small text-body-secondary font-monospace ms-auto" id="count" title="Captures">0</span>
    <button type="button" class="btn btn-sm btn-outline-secondary" id="capture" title="Capture now" aria-label="Capture now">
      <i class="bi bi-camera" aria-hidden="true"></i>
    </button>
    <button type="button" class="btn btn-sm btn-outline-secondary" id="clear" title="Clear history" aria-label="Clear history">
      <i class="bi bi-trash" aria-hidden="true"></i>
    </button>
  </div>
</header>

<main class="container">
  <div class="col-lg-9 col-xl-8 mx-auto pb-5" id="feed"></div>
</main>

<script>
const AUTO    = {{AUTO}};
const HOTKEY  = "{{HOTKEY}}";
const LANG    = document.documentElement.lang;
const feed    = document.getElementById("feed");
const status  = document.getElementById("status");
const count   = document.getElementById("count");
const capture = document.getElementById("capture");
const clear   = document.getElementById("clear");
let n = 0;

function resetFeed() {
  const how = AUTO
    ? "New lines are captured automatically when the text area changes."
    : HOTKEY
      ? `Press <code>${HOTKEY}</code> to capture, even with the game focused.`
      : "Continuous capture is off.";
  feed.innerHTML = `<p class="empty text-body-secondary small lh-lg py-5 m-0">
    Waiting for a capture.<br>
    ${how}<br>
    You can also capture with the camera button above, or <code>curl -X POST ${location.origin}/capture</code>.
  </p>`;
  n = 0;
  count.textContent = n;
}
resetFeed();

capture.onclick = () => fetch("/capture", { method: "POST" });

// Clears the server side too (the history replayed to new connections, and the other open tabs).
// resetFeed() runs when the server sends back its "clear" message, not here, to stay consistent across tabs.
clear.onclick = () => fetch("/clear", { method: "POST" });

const COPY = '<i class="bi bi-clipboard" aria-hidden="true"></i> Copy image';
const COPIED = '<i class="bi bi-check-lg" aria-hidden="true"></i> Copied';

function addCapture(data) {
  const empty = feed.querySelector(".empty");
  if (empty) empty.remove();

  const el = document.createElement("article");
  el.className = "capture border-bottom py-4";

  const meta = document.createElement("div");
  meta.className = "d-flex align-items-center gap-3 small text-body-secondary font-monospace mb-3";
  meta.innerHTML = `<span>${data.ts}</span><span>${data.ms} ms</span>`;

  const copy = document.createElement("button");
  copy.type = "button";
  copy.className = "btn btn-sm btn-outline-secondary ms-auto";
  copy.innerHTML = COPY;
  copy.onclick = async () => {
    const blob = await (await fetch(data.image)).blob();
    const png = await toPng(blob);
    await navigator.clipboard.write([new ClipboardItem({ "image/png": png })]);
    copy.innerHTML = COPIED;
    setTimeout(() => (copy.innerHTML = COPY), 1400);
  };
  meta.appendChild(copy);

  const img = document.createElement("img");
  img.className = "shot img-fluid w-100 rounded border mb-3";
  img.src = data.image;
  img.alt = "";

  const line = document.createElement("p");
  line.className = "line fs-3 lh-lg m-0";
  line.lang = LANG;
  line.textContent = data.text;

  el.append(meta, img, line);
  const stick = isNearBottom();
  feed.append(el);

  count.textContent = ++n;
  if (stick) el.scrollIntoView({ behavior: "smooth", block: "end" });
}

// only sticks to the bottom if the user didn't scroll up to read the history
function isNearBottom() {
  return window.innerHeight + window.scrollY >= document.body.offsetHeight - 80;
}

// the clipboard only accepts PNG: go through a canvas
function toPng(blob) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => {
      const c = document.createElement("canvas");
      c.width = img.width; c.height = img.height;
      c.getContext("2d").drawImage(img, 0, 0);
      c.toBlob(resolve, "image/png");
    };
    img.src = URL.createObjectURL(blob);
  });
}

function setStatus(text, live) {
  status.textContent = text;
  status.className = `badge rounded-pill ${live ? "text-bg-success" : "text-bg-warning"}`;
}

function connect() {
  const ws = new WebSocket(`ws://${location.host}/ws`);

  ws.onopen = () => setStatus("listening", true);

  ws.onmessage = (e) => {
    const data = JSON.parse(e.data);
    if (data.type === "clear") resetFeed();
    else addCapture(data);
  };

  ws.onclose = () => {
    setStatus("server stopped - retrying", false);
    setTimeout(connect, 2000);
  };
}

connect();
</script>
</body>
</html>
