["single characters"]
# As single characters, they're pronounced like this most of the time.
"會" = "hui4"  # can, will, a meeting
"和" = "han4"  # he2 can be heard too, but most of the time Taiwanese say han4.
"那" = "na4"
"呢" = "ne5"  # the particle
